<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel · Espaço Baobá</title>
  <link rel="icon" type="image/png" href="/assets/favicon-48.png">
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml">
</head>
<body>
  <!-- Decap CMS: the school writes and publishes blog posts here. Settings in config.yml -->
  <script>
    // An expired pass would leave the editor with empty fields: send the person back to the password screen.
    (function () {
      var original = window.fetch;
      window.fetch = function () {
        return original.apply(this, arguments).then(function (res) {
          if (res.status === 401 && String(res.url).indexOf('/api/github/') !== -1) {
            localStorage.removeItem('decap-cms-user');
            alert('Sua sessão expirou. Entre de novo com a senha.');
            location.reload();
          }
          return res;
        });
      };
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('/assets/styles.css');
    CMS.registerPreviewStyle('/assets/blog.css');
    // The school logs in with a password, not with GitHub: say just "Entrar".
    new MutationObserver(() => {
      document.querySelectorAll('button').forEach((b) => {
        if (/GitHub/i.test(b.textContent)) b.textContent = 'Entrar no painel';
      });
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
